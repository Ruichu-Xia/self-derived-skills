# Settings shared by the GRPO probe and the standard GRPO baseline on MATH.
split_manifest: configs/math_split.json

model:
  name: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17
  # TRL's gradient kernel cannot run bf16 on GPUs older than compute capability 8.0, such as a T4.
  dtype: float32

# From TRL's LoRA example. Not yet validated on this model.
lora:
  r: 32
  lora_alpha: 64
  target_modules: all-linear

trainer:
  # Each optimizer step samples 8 problems with 4 completions each: 4 x 8 / 4 = 8 problems.
  # Accumulating over small batches limits the memory used by backward passes on a T4.
  num_generations: 4
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  max_completion_length: 1024
  chat_template_kwargs:
    enable_thinking: false
  # TRL's default variant: DAPO token normalization and no KL penalty.
  loss_type: dapo
  scale_rewards: group
  beta: 0.0
  # 1e-4, from TRL's LoRA example, lowered dev accuracy on this model. 1e-5 is the rate in
  # Hugging Face's GRPO cookbook.
  learning_rate: 1.0e-5
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  gradient_checkpointing: true
  # TRL defaults to bf16 unless it is turned off here.
  bf16: false
  seed: 230
  logging_steps: 1
  report_to: none
  save_strategy: steps
  save_steps: 20

# How the untrained model's skills are written and selected.
skills:
  # A skill that reaches this limit is dropped as unfinished. One sentence fits well within it.
  max_skill_tokens: 64
  bank_size: 10
  # The embedding model ExpeL used to compare tasks.
  embedding_model: sentence-transformers/all-mpnet-base-v2
  embedding_revision: e8c3b32edf5434bc2275fc9bab85f82640a19130
