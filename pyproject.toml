[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "self-derived-skills"
version = "0.1.0"
description = "GRPO for small language models conditioned on self-derived procedural skills."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets==5.1.0",
    "math-verify[antlr4_13_2]==0.9.0",
]

[project.optional-dependencies]
# torch stays unpinned so Colab can keep its preinstalled CUDA build. Runs record the actual version.
train = [
    "accelerate==1.15.0",
    "peft==0.21.2",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "sentence-transformers==6.2.0",
    "torch>=2.6.0",
    "transformers==5.22.1",
    "trl==1.17.1",
]

# Optimized kernel for Qwen3.5's linear-attention layers. It needs CUDA, so it is separate from
# train. Without it transformers falls back to a far slower reference implementation.
cuda = [
    "flash-linear-attention[cuda]==0.6.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/self_derived_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
